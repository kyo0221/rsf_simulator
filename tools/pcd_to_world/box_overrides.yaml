# 実寸直方体への置換。footprint を margin だけ広げた範囲の、h が z_bottom_h〜z_top_h のボクセル/柱を
# visual・collision から除去し、向き付き直方体(地形-0.05 から上端まで。collision は h 1.2 まで)を追加する。
# 座標は map = 点群座標(公式原点中心の局所 ENU)。
boxes:
  # 旧 69〜70 の間の歩道柱。元点群の柱の断面(h 2〜5m の点の外形)の実測: 1.05〜1.10 x 0.44〜0.45m。
  #  旧 map(enu_origin_spherical 変換)での中心 (-86.510, -352.336)、yaw 127.18° を、旧変換の逆で点群座標へ換算:
  #  中心 = 点群座標 (446.482, 185.027) そのもの(元々実測した柱位置)、yaw = 127.18 + 旧 georef の回転(約 -134.6°)
  #  = -98.20° (= 81.80°、長軸は 180° 対称)。点群の PCA 長軸の向きは 82.6° で一致を確認した。
  #  上端 h=柱芯内の h の 99.5 パーセンタイル(3.86m)。
  - {center_x: 446.482, center_y: 185.027, yaw_deg: 81.80, size_x: 1.10, size_y: 0.45,
     z_bottom_h: 0.0, z_top_h: 3.86, margin: 0.25}
