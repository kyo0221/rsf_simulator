# 実寸直方体への置換。footprint を margin だけ広げた範囲の、h が z_bottom_h〜z_top_h のボクセル/柱を
# visual・collision から除去し、向き付き直方体(地形-0.05 から上端まで。collision は h 1.2 まで)を追加する。
boxes:
  # 69〜70 の間の歩道柱。元点群の柱の断面(h 2〜5m の点の外形)の実測: 1.05〜1.10 x 0.44〜0.45m、長軸の向き 126〜127°、
  #  旧変換(平面直角 EPSG:6677 + オフセット 21903.18/9223.38, ellipsoid ENU)での map 中心 (-87.50, -352.06)、yaw 127°。
  #  座標変換を「点群=原点(36.082880N, 140.076545E)中心の局所 ENU + 球近似」(enu_origin_spherical)に変えたため、
  #  柱の点群座標 (446.482, 185.027) へ逆変換してから新変換で map に戻し center と yaw を換算した
  #  (中心は (+0.990, -0.276) m、yaw は +0.18° 変化)。
  #  上端 h=柱芯内の h の 99.5 パーセンタイル(3.86m)。
  - {center_x: -86.510, center_y: -352.336, yaw_deg: 127.18, size_x: 1.10, size_y: 0.45,
     z_bottom_h: 0.0, z_top_h: 3.86, margin: 0.25}
