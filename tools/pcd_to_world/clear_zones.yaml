# 区間クリアゾーン: 線分から radius[m] 以内のセルで、構造物の最大 h <= max_h[m] なら除去する。
# 経路全体のクリア(--clear-radius/--clear-max-h)とは OR で適用される。追加はここに行を足す。
# 座標は map = 点群座標(公式原点中心の局所 ENU)。以下のゾーンは、旧 map 座標(旧 georef で回転した座標)で
# 定義していたものを、旧変換(enu_origin_spherical)の逆で点群座標へ換算したもの(radius と max_h は不変)。
# 「旧 wp 番号」は旧 tsukuba_wp.yaml の 0 始まりインデックス(新 waypoint とは番号が対応しない)。
zones:
  # 旧: スポーン(70.571,71.831) -> wp4 付近(スタート直後の直線)  旧 (70.571,71.831)->(104.7,99.559)
  - {x1: 33.859, y1: -0.728, x2: -9.903, y2: 4.050, radius: 3.0, max_h: 0.5}

  # --- 以下、旧 wp 番号は旧 yaml の 0 始まりインデックス。max_h は全て 0.5 ---
  # 旧 13〜15 の間の低層ブロック (旧 13->14, 14->15), radius 8
  #   旧 (207.731,78.503)->(217.238,63.780)->(208.985,55.970)
  - {x1: -67.398, y1: 91.861, x2: -63.600, y2: 108.917, radius: 8.0, max_h: 0.5}
  - {x1: -63.600, y1: 108.917, x2: -52.231, y2: 108.535, radius: 8.0, max_h: 0.5}
  # 旧 16〜18 区間の柱と柱の間の低層ブロック (旧 16->17, 17->18), radius 5 (上空の屋根・柱は上端 h>0.5 なので残る)
  #   旧 (186.399,40.616)->(171.700,29.410)->(162.370,21.790)
  - {x1: -25.404, y1: 103.274, x2: -7.081, y2: 100.701, radius: 5.0, max_h: 0.5}
  - {x1: -7.081, y1: 100.701, x2: 4.911, y2: 99.423, radius: 5.0, max_h: 0.5}
  # 旧 19〜20 (旧 19->20), radius 5   旧 (151.821,12.807)->(150.009,7.220)
  - {x1: 18.731, y1: 98.235, x2: 23.986, y2: 100.864, radius: 5.0, max_h: 0.5}
  # 旧 27〜28 (旧 27->28), radius 8   旧 (69.692,-20.664)->(45.022,-41.792)
  - {x1: 100.356, y1: 63.443, x2: 132.762, y2: 60.750, radius: 8.0, max_h: 0.5}
